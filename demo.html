    <title>MessageBird Popup Integration</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Include the MessageBird embeddable script -->

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      header {
        background-color: #4caf50;
        color: white;
        padding: 15px;
        text-align: center;
      }

      main {
        flex: 1;
        padding: 20px;
        text-align: center;
      }

      footer {
        background-color: #333;
        color: white;
        padding: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Welcome to Our Website</h1>
    </header>

    <!-- MessageBird Popup -->
    <messagebird-popup
      project-id="cb066fef-d274-4e87-a47e-56d83ef95dd5"
      workspace-id="01df8c02-630b-4629-bf7b-296756455320"

    <main>
      <p>
        Explore our features and services. If you need help, use the chat button
        below!
      </p>
    </main>

    <footer>
      <p>&copy; 2024 Your Company Name. All rights reserved.</p>
    </footer>

</html>
